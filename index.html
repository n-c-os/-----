<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>What Browser Am I Using?</title>

  <script src="https://cdn.jsdelivr.net/npm/ua-parser-js/dist/ua-parser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      max-width: 760px;
      margin: auto;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
    }

    .browser {
      margin: 20px 0 28px;
      font-size: 30px;
      font-weight: 700;
    }

    .row {
      display: flex;
      padding: 11px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      width: 175px;
      font-weight: 700;
    }

    .value {
      flex: 1;
    }

    .ua {
      margin-top: 28px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 10px;
      font-family: monospace;
      line-height: 1.5;
      word-break: break-all;
    }

    .pizza {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #eee;
      font-size: 12px;
      vertical-align: middle;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Your Browser</h1>

  <div class="browser" id="browser">
    Detecting...
  </div>

  <div class="row">
    <div class="label">Browser:</div>
    <div class="value" id="browserName">...</div>
  </div>

  <div class="row">
    <div class="label">Version:</div>
    <div class="value" id="browserVersion">...</div>
  </div>

  <div class="row">
    <div class="label">Operating System:</div>
    <div class="value" id="os">...</div>
  </div>

  <div class="row">
    <div class="label">Engine:</div>
    <div class="value" id="engine">...</div>
  </div>

  <div class="row">
    <div class="label">CPU:</div>
    <div class="value" id="cpu">...</div>
  </div>

  <div class="ua">
    <strong>User-Agent</strong>
    <br><br>
    <span id="ua"></span>
  </div>

</div>

<script>
(async () => {

  const ua = navigator.userAgent;

  const parser = new UAParser(ua);
  const result = parser.getResult();

  let browserName = result.browser.name || "Unknown Browser";
  let browserVersion = result.browser.version || "Unknown";

  let engineName = result.engine.name || "Unknown";
  let engineVersion = result.engine.version || "";

  let osName = result.os.name || "Unknown OS";
  let osVersion = result.os.version || "";

  let cpu = result.cpu.architecture || "Unknown";

  /*
   * PizzaBox has priority over the generic UA database.
   */
  const pizzaBoxMatch = ua.match(/PizzaBox\/([\d.]+)/i);

  if (pizzaBoxMatch) {

    browserName = "PizzaBox";
    browserVersion = pizzaBoxMatch[1];

    /*
     * PizzaBox uses Electron / Chromium.
     * Chromium's rendering engine is Blink.
     *
     * AppleWebKit/537.36 remains in the UA for
     * web compatibility; it does NOT mean that
     * PizzaBox actually uses WebKit.
     */
    engineName = "Blink";
    engineVersion = "";

    /*
     * Our current PizzaBox UA explicitly declares
     * Macintosh + Intel Mac OS X.
     */
    if (/Macintosh;\s*Intel Mac OS X/i.test(ua)) {
      cpu = "x86_64";
    }
  }

  /*
   * Try Client Hints when the browser makes them available.
   */
  try {

    if (
      navigator.userAgentData &&
      navigator.userAgentData.getHighEntropyValues
    ) {

      const info =
        await navigator.userAgentData.getHighEntropyValues([
          "architecture",
          "bitness"
        ]);

      if (info.architecture) {

        cpu = info.architecture;

        if (info.bitness) {
          cpu += " " + info.bitness + "-bit";
        }
      }
    }

  } catch (error) {
    // Keep the value obtained from UAParser / PizzaBox.
  }

  document.querySelector("#browser").textContent =
    browserName + " " + browserVersion;

  document.querySelector("#browserName").textContent =
    browserName;

  document.querySelector("#browserVersion").textContent =
    browserVersion;

  document.querySelector("#os").textContent =
    osName + (osVersion ? " " + osVersion : "");

  document.querySelector("#engine").textContent =
    engineName + (engineVersion ? " " + engineVersion : "");

  document.querySelector("#cpu").textContent =
    cpu;

  document.querySelector("#ua").textContent =
    ua;

})();
</script>

</body>
</html>
